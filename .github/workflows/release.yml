name: Multiplatform Release ZL1 (Linux, Android, Windows, macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: zl1-linux-x64
            bin: zl1-cli
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: zl1-windows-x64
            bin: zl1-cli.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: zl1-macos-arm64
            bin: zl1-cli
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: zl1-macos-x64
            bin: zl1-cli
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build target
        run: cargo build --release --target ${{ matrix.target }} -p zl1-cli
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  build-cross-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build target with cross linker
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target aarch64-unknown-linux-gnu -p zl1-cli
      - name: Upload Linux ARM64
        uses: actions/upload-artifact@v4
        with:
          name: zl1-linux-arm64
          path: target/aarch64-unknown-linux-gnu/release/zl1-cli

  build-termux-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true
      - name: Build Android Termux CLI
        run: |
          TOOLCHAIN=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64
          export PATH=$TOOLCHAIN/bin:$PATH
          export CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android24-clang++
          export AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android24-clang
          cargo build --release --target aarch64-linux-android -p zl1-cli
      - name: Upload Termux Binaries
        uses: actions/upload-artifact@v4
        with:
          name: zl1-termux-android
          path: target/aarch64-linux-android/release/zl1-cli

  upload-release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload Prebuilt Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: zl1-android-apk
          path: dist/zl1-archiver-release.apk

  release:
    needs: [build-desktop, build-cross-linux-arm64, build-termux-android, upload-release-apk]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            */*
